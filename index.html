<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section id="login-view" class="panel hidden" aria-live="polite">
        <p class="fixed-email">admin@f1959.com</p>
        <form id="login-form" class="stack">
          <label class="sr-only" for="password">비밀번호</label>
          <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password" />
          <button type="submit">Login</button>
        </form>
      </section>

      <section id="app-view" class="panel hidden" aria-live="polite">
        <form id="download-form" class="stack">
          <label class="sr-only" for="file-url">URL</label>
          <input id="file-url" name="url" type="url" placeholder="https://..." required />
          <button type="submit">Download</button>
        </form>
        <button id="logout-btn" type="button" class="ghost">Logout</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
